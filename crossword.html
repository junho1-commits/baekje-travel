<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>초등 상식 & 역사 크로스워드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1E293B;
  --accent: #3B82F6;
  --correct: #10B981;
  --wrong: #EF4444;
  --gold: #F59E0B;
  --bg: #0F172A;
  --card-bg: #1E293B;
  --card-border: #334155;
  --text: #F8FAFC;
  --sub: #94A3B8;
  --cell-bg: #1E293B;
  --cell-active: #2563EB;
  --cell-related: #1E3A8A;
  --cell-correct: #065F46;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.app-container {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  background: #0F172A;
  position: relative;
  padding-bottom: 30px;
}

/* ── Top Bar ── */
.topbar {
  background: #1E293B;
  border-bottom: 1px solid var(--card-border);
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-title { font-size: 17px; font-weight: 800; color: #FFFFFF; display: flex; align-items: center; gap: 6px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-coins {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid var(--gold);
  color: #FBBF24;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 14px;
  font-weight: 800;
}
.back-btn {
  background: none;
  border: none;
  color: #94A3B8;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}

/* ── Puzzle Selector ── */
.puzzle-selector {
  padding: 14px 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.puzzle-selector::-webkit-scrollbar { display: none; }
.stage-tab {
  padding: 8px 14px;
  border-radius: 12px;
  background: #1E293B;
  border: 1px solid var(--card-border);
  color: var(--sub);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.stage-tab.active {
  background: var(--accent);
  color: #FFFFFF;
  border-color: var(--accent);
}

/* ── Grid Board Area ── */
.board-container {
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.grid {
  display: grid;
  gap: 6px;
  background: #0B1120;
  padding: 10px;
  border-radius: 16px;
  border: 1px solid var(--card-border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.cell {
  position: relative;
  width: 52px;
  height: 52px;
  background: var(--cell-bg);
  border: 1px solid var(--card-border);
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 22px;
  font-weight: 800;
  color: #FFFFFF;
  cursor: pointer;
  user-select: none;
  transition: all 0.15s ease;
}
.cell.block {
  background: transparent;
  border-color: transparent;
  pointer-events: none;
}
.cell.active {
  background: var(--cell-active);
  border-color: #60A5FA;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
  transform: scale(1.05);
  z-index: 2;
}
.cell.related {
  background: var(--cell-related);
  border-color: #3B82F6;
}
.cell.correct {
  background: var(--cell-correct);
  border-color: #10B981;
  color: #A7F3D0;
}
.cell-num {
  position: absolute;
  top: 2px;
  left: 4px;
  font-size: 10px;
  font-weight: 700;
  color: #94A3B8;
}

/* ── Active Clue Banner ── */
.clue-banner {
  margin: 10px 16px;
  background: #1E293B;
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.clue-tag {
  display: inline-block;
  background: var(--accent);
  color: #FFFFFF;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 6px;
}
.clue-title { font-size: 16px; font-weight: 800; color: #FFFFFF; margin-bottom: 4px; line-height: 1.4; }
.clue-desc { font-size: 13px; color: #94A3B8; }
.clue-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--card-border);
}
.hint-btn {
  background: rgba(245, 158, 11, 0.15);
  border: 1px solid var(--gold);
  color: #FBBF24;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* ── Touch Controls ── */
.keyboard {
  padding: 10px 14px;
  background: #1E293B;
  border-top: 1px solid var(--card-border);
  margin-top: 10px;
}
.kb-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
.kb-btn-large {
  flex: 1;
  padding: 14px;
  background: var(--accent);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
}
.kb-btn-sec {
  flex: 1;
  padding: 14px;
  background: #334155;
  color: #FFFFFF;
  border: 1px solid var(--card-border);
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

/* ── Clue List Area ── */
.clue-lists {
  padding: 10px 16px 20px;
}
.clue-lists h4 { font-size: 15px; font-weight: 800; color: #94A3B8; margin: 14px 0 8px; }
.clue-item {
  background: #1E293B;
  border: 1px solid var(--card-border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  cursor: pointer;
  line-height: 1.5;
}
.clue-item.active { border-color: var(--accent); background: #1E3A8A; }
.clue-item.solved { opacity: 0.5; text-decoration: line-through; }
.clue-item-num { font-weight: 800; color: #60A5FA; margin-right: 6px; }

/* ── Completion Modal ── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}
.modal-card {
  background: #1E293B;
  border: 2px solid var(--gold);
  border-radius: 20px;
  padding: 26px 20px;
  text-align: center;
  max-width: 360px;
  width: 100%;
}
.modal-icon { font-size: 54px; margin-bottom: 10px; }
.modal-title { font-size: 22px; font-weight: 800; color: #FFFFFF; margin-bottom: 6px; }
.modal-desc { font-size: 14px; color: var(--sub); margin-bottom: 18px; }
.modal-reward {
  background: rgba(217, 119, 6, 0.15);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 20px;
}
.modal-reward-val { font-size: 28px; font-weight: 900; color: #FBBF24; }
.modal-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="app-container">

  <!-- ── TOP BAR ── -->
  <div class="topbar">
    <div class="topbar-title">
      <span>🧩 크로스워드</span>
      <span style="font-size:12px;color:var(--sub);font-weight:600;">상식&역사</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-coins" id="cw-coins">0원</div>
      <a href="learn.html" class="back-btn">학습홈 ✕</a>
    </div>
  </div>

  <!-- ── STAGE SELECTOR (역사 + 흥미진진한 초등 상식) ── -->
  <div class="puzzle-selector" id="stage-tabs">
    <div class="stage-tab active" onclick="loadPuzzle(0)">1. 한성과 생활과학</div>
    <div class="stage-tab" onclick="loadPuzzle(1)">2. 웅진과 지구생물</div>
    <div class="stage-tab" onclick="loadPuzzle(2)">3. 사비와 우주탐험</div>
    <div class="stage-tab" onclick="loadPuzzle(3)">4. 익산과 스포츠상식</div>
    <div class="stage-tab" onclick="loadPuzzle(4)">5. 위인과 문화예술</div>
    <div class="stage-tab" onclick="loadPuzzle(5)">6. IT와 미래기술</div>
  </div>

  <!-- ── ACTIVE CLUE BANNER ── -->
  <div class="clue-banner" id="clue-banner">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="clue-tag" id="clue-dir-tag">가로 01</span>
      <span style="font-size:12px;color:var(--sub);" id="clue-word-len">4글자</span>
    </div>
    <div class="clue-title" id="clue-title">문제를 터치하여 시작하세요</div>
    <div class="clue-desc" id="clue-desc">정답을 맞추면 총 용돈에 +1,000원이 적립됩니다!</div>
    <div class="clue-actions">
      <button class="hint-btn" onclick="showChosungHint()">초성 힌트 보기</button>
      <span style="font-size:13px;color:#38BDF8;font-weight:700;" id="clue-chosung"></span>
    </div>
  </div>

  <!-- ── GRID BOARD ── -->
  <div class="board-container">
    <div class="grid" id="grid-board"></div>
  </div>

  <!-- ── TOUCH CONTROLS ── -->
  <div class="keyboard">
    <div class="kb-row">
      <button class="kb-btn-large" onclick="inputAnswerPrompt()">정답 입력하기 ✍️</button>
    </div>
    <div class="kb-row">
      <button class="kb-btn-sec" onclick="toggleDirection()">가로 / 세로 전환 🔄</button>
      <button class="kb-btn-sec" onclick="clearActiveWord()">글자 지우기 ⌫</button>
    </div>
  </div>

  <!-- ── CLUE LISTS ── -->
  <div class="clue-lists">
    <h4>가로 문제</h4>
    <div id="across-list"></div>
    <h4>세로 문제</h4>
    <div id="down-list"></div>
  </div>

</div>

<!-- ── COMPLETION MODAL ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-icon">🏆</div>
    <div class="modal-title">십자말풀이 완료!</div>
    <div class="modal-desc" id="modal-stage-name">1단계 퍼즐을 완벽하게 풀었습니다!</div>
    <div class="modal-reward">
      <div style="font-size:12px;color:var(--sub);">통합 적립된 기념품 용돈</div>
      <div class="modal-reward-val">+1,000원</div>
    </div>
    <button class="modal-btn" onclick="nextStagePuzzle()">다음 십자말풀이 도전하기 →</button>
  </div>
</div>

// ══════════════════════════════════════
// TOTAL WALLET SYSTEM (통합 지갑 연동)
// ══════════════════════════════════════
const MAX_COINS = 50000;

function getGlobalState(){
  try {
    const raw = localStorage.getItem('baekje_master_state');
    if(raw) return JSON.parse(raw);
  } catch(e){}
  // Fallback to single coins key if exists
  const legacyCoins = parseInt(localStorage.getItem('baekje_coins') || '0');
  return {
    coins: legacyCoins,
    history: [],
    stages: {},
    wrongNotes: []
  };
}

function saveGlobalState(state){
  localStorage.setItem('baekje_master_state', JSON.stringify(state));
  localStorage.setItem('baekje_coins', state.coins.toString());
}

let appState = getGlobalState();

function updateCoinsUI(){
  document.getElementById('cw-coins').textContent = appState.coins.toLocaleString() + '원';
}

// ══════════════════════════════════════
// GAME ENGINE
// ══════════════════════════════════════
let curPuzzleIdx = 0;
let gridState = [];
let activeWord = null;
let activeCell = { r: 0, c: 0 };
let currentDir = 'A';

function loadPuzzle(idx){
  curPuzzleIdx = idx;
  const p = PUZZLES[idx];

  document.querySelectorAll('.stage-tab').forEach((tab, i)=>{
    tab.className = (i===idx) ? 'stage-tab active' : 'stage-tab';
  });

  gridState = Array(p.size).fill(null).map(() => Array(p.size).fill(''));

  renderBoard();
  renderClueLists();
  selectWord(p.words[0]);
}

function renderBoard(){
  const p = PUZZLES[curPuzzleIdx];
  const gridEl = document.getElementById('grid-board');
  gridEl.style.gridTemplateColumns = `repeat(${p.size}, 1fr)`;
  gridEl.innerHTML = '';

  const cellMap = {};
  p.words.forEach(w => {
    for(let i=0; i<w.word.length; i++){
      const r = (w.dir === 'A') ? w.r : w.r + i;
      const c = (w.dir === 'A') ? w.c + i : w.c;
      const key = `${r}_${c}`;
      cellMap[key] = cellMap[key] || { inWord: true, num: null };
      if(i === 0) cellMap[key].num = w.num;
    }
  });

  for(let r=0; r<p.size; r++){
    for(let c=0; c<p.size; c++){
      const key = `${r}_${c}`;
      const cellEl = document.createElement('div');
      
      if(!cellMap[key]){
        cellEl.className = 'cell block';
      } else {
        cellEl.className = 'cell';
        cellEl.id = `cell_${r}_${c}`;
        cellEl.dataset.r = r;
        cellEl.dataset.c = c;
        if(cellMap[key].num){
          cellEl.innerHTML = `<span class="cell-num">${cellMap[key].num}</span>`;
        }
        cellEl.onclick = () => onCellClick(r, c);
      }
      gridEl.appendChild(cellEl);
    }
  }
}

function onCellClick(r, c){
  const p = PUZZLES[curPuzzleIdx];
  const candidateWords = p.words.filter(w => {
    if(w.dir === 'A') return w.r === r && c >= w.c && c < w.c + w.word.length;
    else return w.c === c && r >= w.r && r < w.r + w.word.length;
  });

  if(candidateWords.length === 0) return;

  if(activeCell.r === r && activeCell.c === c && candidateWords.length > 1){
    currentDir = (currentDir === 'A') ? 'D' : 'A';
  }

  let selected = candidateWords.find(w => w.dir === currentDir) || candidateWords[0];
  currentDir = selected.dir;
  activeCell = { r, c };
  selectWord(selected);
}

function selectWord(w){
  activeWord = w;
  currentDir = w.dir;

  document.getElementById('clue-dir-tag').textContent = (w.dir === 'A' ? '가로 ' : '세로 ') + (w.num < 10 ? '0' : '') + w.num;
  document.getElementById('clue-word-len').textContent = `${w.word.length}글자`;
  document.getElementById('clue-title').textContent = w.clue;
  document.getElementById('clue-desc').textContent = `정답 단어: ${w.word.length}글자`;
  document.getElementById('clue-chosung').textContent = '';

  const p = PUZZLES[curPuzzleIdx];
  for(let r=0; r<p.size; r++){
    for(let c=0; c<p.size; c++){
      const el = document.getElementById(`cell_${r}_${c}`);
      if(!el) continue;
      el.classList.remove('active', 'related');

      const inActiveWord = (w.dir === 'A') 
        ? (r === w.r && c >= w.c && c < w.c + w.word.length)
        : (c === w.c && r >= w.r && r < w.r + w.word.length);

      if(r === activeCell.r && c === activeCell.c){
        el.classList.add('active');
      } else if(inActiveWord){
        el.classList.add('related');
      }
    }
  }

  document.querySelectorAll('.clue-item').forEach(item => {
    item.classList.toggle('active', item.dataset.id === w.id);
  });
}

function showChosungHint(){
  if(!activeWord) return;
  document.getElementById('clue-chosung').textContent = `초성: ${activeWord.chosung}`;
}

function toggleDirection(){
  if(!activeWord) return;
  const p = PUZZLES[curPuzzleIdx];
  const otherWords = p.words.filter(w => {
    if(w.dir === 'A') return w.r === activeCell.r && activeCell.c >= w.c && activeCell.c < w.c + w.word.length;
    else return w.c === activeCell.c && activeCell.r >= w.r && activeCell.r < w.r + w.word.length;
  });
  if(otherWords.length > 1){
    const other = otherWords.find(w => w.id !== activeWord.id);
    if(other) selectWord(other);
  }
}

function inputAnswerPrompt(){
  if(!activeWord) return;
  const ans = prompt(`[${activeWord.dir==='A'?'가로':'세로'} ${activeWord.num}번: ${activeWord.word.length}글자]
${activeWord.clue}

정답 단어를 입력하세요:`);
  if(ans){
    const clean = ans.trim();
    for(let i=0; i<Math.min(clean.length, activeWord.word.length); i++){
      const r = (activeWord.dir === 'A') ? activeWord.r : activeWord.r + i;
      const c = (activeWord.dir === 'A') ? activeWord.c + i : activeWord.c;
      gridState[r][c] = clean[i];
      updateCellDisplay(r, c);
    }
    checkAllWords();
  }
}

function clearActiveWord(){
  if(!activeWord) return;
  for(let i=0; i<activeWord.word.length; i++){
    const r = (activeWord.dir === 'A') ? activeWord.r : activeWord.r + i;
    const c = (activeWord.dir === 'A') ? activeWord.c + i : activeWord.c;
    gridState[r][c] = '';
    updateCellDisplay(r, c);
  }
  checkAllWords();
}

function updateCellDisplay(r, c){
  const el = document.getElementById(`cell_${r}_${c}`);
  if(!el) return;
  const numSpan = el.querySelector('.cell-num');
  const numHtml = numSpan ? numSpan.outerHTML : '';
  el.innerHTML = numHtml + gridState[r][c];
}

function checkAllWords(){
  const p = PUZZLES[curPuzzleIdx];
  let allCorrect = true;

  p.words.forEach(w => {
    let currentStr = '';
    for(let i=0; i<w.word.length; i++){
      const r = (w.dir === 'A') ? w.r : w.r + i;
      const c = (w.dir === 'A') ? w.c + i : w.c;
      currentStr += gridState[r][c] || '';
    }
    const isSolved = (currentStr === w.word);
    
    const itemEl = document.querySelector(`.clue-item[data-id="${w.id}"]`);
    if(itemEl) itemEl.classList.toggle('solved', isSolved);

    if(isSolved){
      for(let i=0; i<w.word.length; i++){
        const r = (w.dir === 'A') ? w.r : w.r + i;
        const c = (w.dir === 'A') ? w.c + i : w.c;
        const el = document.getElementById(`cell_${r}_${c}`);
        if(el) el.classList.add('correct');
      }
    }
    if(!isSolved) allCorrect = false;
  });

  if(allCorrect){
    onPuzzleComplete();
  }
}

function onPuzzleComplete(){
  const reward = 1000;
  appState.coins = Math.min(appState.coins + reward, MAX_COINS);
  appState.history = appState.history || [];
  appState.history.push({
    desc: `십자말풀이 (${PUZZLES[curPuzzleIdx].title}) 완료`,
    amount: reward,
    date: new Date().toLocaleTimeString()
  });
  saveGlobalState(appState);
  updateCoinsUI();

  document.getElementById('modal-stage-name').textContent = `${PUZZLES[curPuzzleIdx].title} 완료!`;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function nextStagePuzzle(){
  document.getElementById('modal-overlay').style.display = 'none';
  const nextIdx = (curPuzzleIdx + 1) % PUZZLES.length;
  loadPuzzle(nextIdx);
}

function renderClueLists(){
  const p = PUZZLES[curPuzzleIdx];
  const aList = document.getElementById('across-list');
  const dList = document.getElementById('down-list');
  aList.innerHTML = '';
  dList.innerHTML = '';

  p.words.forEach(w => {
    const item = document.createElement('div');
    item.className = 'clue-item';
    item.dataset.id = w.id;
    item.innerHTML = `<span class="clue-item-num">[${w.dir==='A'?'가로':'세로'} ${w.num}번]</span> ${w.clue} (${w.word.length}글자)`;
    item.onclick = () => {
      activeCell = { r: w.r, c: w.c };
      selectWord(w);
    };
    if(w.dir === 'A') aList.appendChild(item);
    else dList.appendChild(item);
  });
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
updateCoinsUI();
loadPuzzle(0);
</script>
